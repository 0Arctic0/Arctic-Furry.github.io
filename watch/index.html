<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="alternate icon" href="../windows-app/icon.ico" />
  <meta name="description" content="Watch a Roblox game and get told the moment a server has an open slot - auto-join optional." />
  <link rel="canonical" href="https://arctic0dev.github.io/watch/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arctic Joiner" />
  <meta property="og:title" content="Server Watch - Arctic Joiner" />
  <meta property="og:description" content="Watch a Roblox game and get told the moment a server has an open slot - auto-join optional." />
  <meta property="og:url" content="https://arctic0dev.github.io/watch/" />
  <meta property="og:image" content="https://arctic0dev.github.io/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#0f1117" />
  <title>Server Watch</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-page="watch">
  <main class="page">
    <section class="card card-wide">
      <h1>Server Watch</h1>
      <p>Paste a <strong>Roblox game link</strong> and it watches for you - tells you how many servers have open slots, and can auto-join the moment a slot frees up.</p>

      <div class="field">
        <label for="watch-game">Roblox game link or place ID</label>
        <input id="watch-game" placeholder="https://www.roblox.com/games/1962086868/Tower-of-Hell" />
      </div>

      <div class="buttons">
        <button class="button" id="watch-start">Start Watching</button>
        <button class="button secondary" id="watch-stop">Stop</button>
        <button class="button secondary" id="watch-refresh">Refresh Now</button>
        <a class="button secondary" href="../servers/">Server Browser</a>
      </div>

      <label style="display: flex; align-items: center; gap: 8px; margin: 6px 0 2px;">
        <input type="checkbox" id="watch-autojoin" />
        <span class="small">Auto-join the emptiest server as soon as a slot opens</span>
      </label>

      <div class="stack" id="watch-game-info" style="margin-top: 12px;"></div>
      <p class="small status" id="watch-status">Waiting for a game link...</p>
      <div class="stack" id="watch-list"></div>
    </section>
  </main>
  <script>
  (function () {
    var gameBox = document.getElementById('watch-game');
    var startBtn = document.getElementById('watch-start');
    var stopBtn = document.getElementById('watch-stop');
    var refreshBtn = document.getElementById('watch-refresh');
    var autoJoinBox = document.getElementById('watch-autojoin');
    var statusEl = document.getElementById('watch-status');
    var listEl = document.getElementById('watch-list');
    var infoEl = document.getElementById('watch-game-info');

    var currentPlaceId = null;
    var currentGameName = null;
    var watchTimer = null;
    var watching = false;
    var joinedOnce = false;

    function setStatus(text, error) {
      statusEl.textContent = text;
      statusEl.className = 'small status' + (error ? ' error' : '');
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function parseGameLink(value) {
      var text = String(value || '').trim();
      if (!text) return null;
      if (/^\d+$/.test(text)) return parseInt(text, 10);
      var m = text.match(/\/games\/(\d+)/i) || text.match(/placeId=(\d+)/i);
      if (m) return parseInt(m[1], 10);
      return null;
    }

    function mirrorAlternatives(url) {
      return [url, 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url.replace('.roproxy.com', '.roblox.com'))];
    }

    function firstOk(urls) {
      var i = 0;
      function attempt() {
        if (i >= urls.length * 2) {
          return Promise.reject(new Error('All API routes are temporarily unavailable. Wait a moment and try again.'));
        }
        var target = urls[i % urls.length];
        var wait = i >= urls.length ? 800 : 0;
        return new Promise(function (resolve) { setTimeout(resolve, wait); }).then(function () {
          return fetch(target).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json().catch(function () { throw new Error('Route returned an invalid response.'); });
          });
        }).catch(function () { i++; return attempt(); });
      }
      return attempt();
    }

    function getApi(url) { return firstOk(mirrorAlternatives(url)); }
    function loadGameInfo() {
      return getApi('https://apis.roproxy.com/universes/v1/places/' + currentPlaceId + '/universe')
        .then(function (u) {
          if (!u || !u.universeId) throw new Error('Could not resolve that place.');
          return getApi('https://games.roproxy.com/v1/games?universeIds=' + u.universeId);
        })
        .then(function (root) {
          var games = root.data || [];
          if (!games.length) throw new Error('Could not load that game.');
          var g = games[0];
          currentGameName = g.name;
          infoEl.innerHTML =
            '<div style="display:flex; align-items:center; gap:12px;">' +
            '<img width="64" height="64" style="border-radius:8px;" alt="game icon" src="https://thumbnails.roproxy.com/v1/places/gameicons?placeIds=' +
            currentPlaceId + '&size=150x150&format=Png&isCircular=false" />' +
            '<div><strong>' + escapeHtml(g.name) + '</strong>' +
            '<div class="small">' + (g.playing || 0).toLocaleString() + ' playing right now - place ' + currentPlaceId + '</div></div></div>';
        });
    }

    function loadServers() {
      var cursor = null;
      var all = [];
      function page() {
        var url = 'https://games.roproxy.com/v1/games/' + currentPlaceId +
          '/servers/Public?limit=100' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
        return getApi(url).then(function (root) {
          (root.data || []).forEach(function (s) { all.push(s); });
          if (root.nextPageCursor) { cursor = root.nextPageCursor; return page(); }
          return all;
        });
      }
      return page();
    }

    function withRoom(servers) {
      return servers.filter(function (s) { return (s.playing || 0) < (s.maxPlayers || 0); });
    }

    function render(servers) {
      servers.sort(function (a, b) { return (b.playing || 0) - (a.playing || 0); });
      var open = withRoom(servers);
      var totalPlaying = 0;
      servers.forEach(function (s) { totalPlaying += (s.playing || 0); });
      listEl.textContent = '';
      var head = document.createElement('div');
      head.className = 'field';
      head.innerHTML = '<strong>' + open.length + ' of ' + servers.length + ' servers have open slots</strong>' +
        '<div class="small">' + totalPlaying.toLocaleString() + ' people playing right now</div>';
      listEl.appendChild(head);
      servers.slice(0, 12).forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'field';
        var full = (s.playing || 0) >= (s.maxPlayers || 0);
        var pct = s.maxPlayers ? Math.round((s.playing / s.maxPlayers) * 100) : 0;
        row.innerHTML =
          '<div style="display:flex; align-items:center; gap:12px; justify-content:space-between;">' +
          '<div><strong>' + s.playing + ' / ' + s.maxPlayers + ' players</strong>' +
          '<div class="small">' + pct + '% full - server ' + escapeHtml(String(s.id)) + '</div></div>' +
          '<div class="buttons" style="margin:0;">' +
          (full ? '<button class="button secondary" disabled>Full</button>'
                : '<button class="button" data-watch-server="' + escapeHtml(String(s.id)) + '">Join</button>' +
                  '<button class="button secondary" data-arctic-server="' + escapeHtml(String(s.id)) + '">Arctic Joiner</button>') +
          '</div></div>';
        listEl.appendChild(row);
      });
      return open;
    }

    function joinServer(id) {
      if (!currentPlaceId || !id) return;
      window.location.href = 'roblox://placeId=' + currentPlaceId + '&gameInstanceId=' + id;
    }

    function tick() {
      if (!currentPlaceId) return Promise.resolve();
      setStatus('Checking servers...');
      return loadServers().then(function (servers) {
        if (!servers.length) {
          setStatus('No public servers right now - trying again in 20 seconds.');
          return;
        }
        var open = render(servers);
        if (open.length === 0) {
          setStatus('All servers are full. Watching for an open slot...');
        } else {
          setStatus(open.length + ' server' + (open.length === 1 ? '' : 's') + ' with open slots. Watching every 20 seconds.');
          if (autoJoinBox && autoJoinBox.checked && !joinedOnce) {
            joinedOnce = true;
            var best = open.slice().sort(function (a, b) { return (a.playing || 0) - (b.playing || 0); })[0];
            setStatus('Slot found - joining the emptiest server (' + best.playing + ' / ' + best.maxPlayers + ').');
            joinServer(best.id);
          }
        }
      }).catch(function (err) { setStatus('Check failed: ' + err.message, true); });
    }

    function startWatching() {
      var placeId = parseGameLink(gameBox.value);
      if (!placeId) { setStatus('That does not look like a Roblox game link or place ID.', true); return; }
      stopWatching();
      currentPlaceId = placeId;
      joinedOnce = false;
      startBtn.disabled = true;
      setStatus('Loading game info...');
      loadGameInfo()
        .catch(function (err) { setStatus('Failed: ' + err.message, true); })
        .then(function () {
          startBtn.disabled = false;
          watching = true;
          tick();
          watchTimer = setInterval(function () { if (watching) tick(); }, 20000);
        });
    }

    function stopWatching() {
      watching = false;
      if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
      setStatus('Stopped watching.');
    }

    listEl.addEventListener('click', function (e) {
      var arcticBtn = e.target && e.target.closest ? e.target.closest('[data-arctic-server]') : null;
      if (arcticBtn && currentPlaceId) {
        window.location.href = 'arcticjoiner://placeId=' + currentPlaceId + '&gameInstanceId=' + arcticBtn.getAttribute('data-arctic-server');
        return;
      }
      var btn = e.target && e.target.closest ? e.target.closest('[data-watch-server]') : null;
      if (!btn) return;
      joinServer(btn.getAttribute('data-watch-server'));
    });

    startBtn.addEventListener('click', startWatching);
    stopBtn.addEventListener('click', stopWatching);
    refreshBtn.addEventListener('click', tick);
    gameBox.addEventListener('keydown', function (e) { if (e.key === 'Enter') startWatching(); });
    autoJoinBox.addEventListener('change', function () { joinedOnce = false; });
  })();

  </script>
</body>
</html>
